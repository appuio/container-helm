name: Release v4

on:
  push:
    branches:
      - main
    tags:
    - "v4*"
    paths:
      - .github/workflows/docker-build-v4.yaml
      - .gpg/**
      - Dockerfile.v4

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v4.3.1; leave empty to derive from the Git ref)"
        required: false
        default: ""
        type: string

env:
  IMAGE_PATH: ${{ vars.IMAGE_PATH }}

jobs:
  # Push image to GitHub Packages.
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Log in to GitHub Package Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

    - name: Set image tag from Git ref
      env:
        DISPATCH_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        # Explicitly dispatched tag wins (e.g. "v4.3.1"); otherwise the Git ref name
        IMAGE_TAG="${DISPATCH_TAG}"
        # Strip "v" prefix from tag name (input may carry it, tag refs always do)
        IMAGE_TAG="${IMAGE_TAG#v}"
        # Use Docker `latest` tag convention
        [ "$IMAGE_TAG" == "main" ] && IMAGE_TAG=latest

        echo "IMAGE_TAG=${IMAGE_TAG}" | tee -a $GITHUB_ENV

    - name: Build docker image
      run: make docker-build-v4

    - name: Push docker image
      run: make docker-push-v4

    - name: Push latest when this is the main tip
      if: env.IMAGE_TAG != 'latest'
      run: |
        # Mirrors the Makefile's IMAGE_PATH default
        image_path="${IMAGE_PATH:-appuio}"
        git fetch origin +refs/heads/main:refs/remotes/origin/main
        if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
          docker tag "ghcr.io/${image_path}/helm-v4:${IMAGE_TAG}" "ghcr.io/${image_path}/helm-v4:latest"
          docker push "ghcr.io/${image_path}/helm-v4:latest"
        else
          echo "HEAD is not the tip of main; not pushing latest"
        fi
